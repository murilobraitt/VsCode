<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="project.css">
    <title>Conversão de Moedas</title>
</head>

<body>
    <main>
        <label>
            Converter <b>de</b>
            <select class="currency-to-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="yuan">¥ Yuan</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="iene">¥ Iene Japonês</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="yuan">¥ Yuan</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="iene">¥ Iene Japonês</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-convertor" type="number" min="0" placeholder="Digite o valor">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="resultado">
                <img class="imagem-de" src="https://img.freepik.com/vetores-premium/brasil-como-um-icone-brilhante-redondo_1222108-165.jpg?semt=ais_hybrid&w=740&q=80" alt="logo-moeda-a-converter">
                <p class="converter-name">Real</p>
                <p class="valor-converter">R$ 0,00</p>
            </div>

                <img class="arrow-img" src="https://cdn-icons-png.flaticon.com/512/6364/6364352.png" alt="seta">
            
            <div class="resultado"></div>
                <img class="imagem" src="https://thumbs.dreamstime.com/b/bandeira-do-estados-unidos-da-am%C3%A9rica-%C3%ADcone-lustroso-vetor-crach%C3%A1-americano-isolado-132659192.jpg" alt="logo-moeda-convertida">
                <p class="convertido-name">Dólar Americano</p>
                <p class="valor-convertido">US$ 0.0</p>
            </div>
        </section>
    </main>

    <script src="./arquivo.js"></script>
</body>
</html>
